<html>
    <head>
        <title id="title">Books</title>
        <link rel="stylesheet" href="{{index .Data "approot"}}/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <div class="topheader">
            <div id="navigation-section" class="navi"></div>
            <div class="font-size-controls">
                <button id="font-decrease" title="Уменьшить шрифт (A-)">A-</button>
                <span id="current-font-size">100%</span>
                <button id="font-increase" title="Увеличить шрифт (A+)">A+</button>
            </div>
            <div class="header-right-section">
                <div class="loading-container">
                    <div id="loading-indicator" class="loading-spinner" style="display: none;"></div>
                </div>
                <div id="search-section" class="search-section">
                    <input type="text" id="search-input" placeholder="Поиск...">
                    <button onclick="performSearch()">Поиск</button>
                </div>
                <div class="theme-toggle">
                    <button id="theme-btn" title="Переключить тему" aria-label="Переключить тему">
                        <img src="{{index .Data "approot"}}/moon.svg" alt="🌙" id="theme-icon" style="width: 20px; height: 20px; vertical-align: middle;">
                    </button>
                </div>
            </div>
        </div>
        <h1 id="title">Books</h1>
        <hr>
        <div id="content"></div>

        <script src="{{index .Data "approot"}}/interface.js"></script>
    </body>
</html>
